<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>سستم تصحيح | إدارة فريق التسويق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@600;700&display=swap">
<style>
/* ===== Brand: change these tokens to restyle the whole app ===== */
:root{
--bg:#F3F3F8; --surface:#ffffff; --surface-2:#EDEDF2; --surface-3:#E4E4EA;
--ink:#0F0F0F; --ink-2:#4A4A52; --ink-3:#8A8A93; --line:#E2E2E8;
--accent:#F05323; --accent-ink:#ffffff; --accent-soft:#FDEBE4; --accent-2:#C9401A;
--red:#d14343; --red-soft:#fdecec; --amber:#b7791f; --amber-soft:#fdf3e1; --green:#2f855a; --green-soft:#e6f4ec;
--brand:#F05323;
--r:14px; --r-sm:10px;
--shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.04);
--shadow-lg:0 12px 40px rgba(16,24,40,.18);
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#0F0F0F; --surface:#171717; --surface-2:#1F1F1F; --surface-3:#292929;
--ink:#F3F3F8; --ink-2:#B4B4BC; --ink-3:#7A7A83; --line:#2A2A2A;
--accent:#F05323; --accent-ink:#0F0F0F; --accent-soft:#3A1E14; --accent-2:#FF7A4D;
--red:#f08080; --red-soft:#3a1f23; --amber:#e6b65c; --amber-soft:#382c17; --green:#6cc79a; --green-soft:#1b3127;
--shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
}
:root[data-theme="dark"]{
--bg:#0F0F0F; --surface:#171717; --surface-2:#1F1F1F; --surface-3:#292929;
--ink:#F3F3F8; --ink-2:#B4B4BC; --ink-3:#7A7A83; --line:#2A2A2A;
--accent:#F05323; --accent-ink:#0F0F0F; --accent-soft:#3A1E14; --accent-2:#FF7A4D;
--red:#f08080; --red-soft:#3a1f23; --amber:#e6b65c; --amber-soft:#382c17; --green:#6cc79a; --green-soft:#1b3127;
--shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.logo .wm{font-family:"Inter","IBM Plex Sans Arabic",sans-serif;font-weight:700;letter-spacing:-.01em;font-size:17px;direction:ltr;unicode-bidi:isolate}
.logo .wm b{color:var(--brand);font-weight:700}
.logo .wm sup{font-size:.45em;font-weight:600;margin-inline-start:1px;vertical-align:super}
.logo .os{color:var(--ink-3);font-weight:500;font-size:13px;padding-inline-start:10px;border-inline-start:1px solid var(--line)}
.nav{display:flex;gap:2px;flex:1}
.nav button{background:none;border:0;padding:7px 14px;border-radius:10px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:7px}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.nav svg{width:18px;height:18px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:none;border-color:transparent}
.btn.on{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft)}
.btn.wa{background:#25a35a;border-color:#25a35a;color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.icon-btn{background:none;border:0;padding:7px;border-radius:9px;color:var(--ink-2);line-height:0}
.icon-btn:hover{background:var(--surface-2)}
.me-wrap{position:relative}
.menu{position:absolute;top:44px;inset-inline-end:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:190px;z-index:30}
.menu button{display:flex;width:100%;background:none;border:0;padding:9px 12px;border-radius:8px;text-align:start;gap:8px;align-items:center}
.menu button:hover{background:var(--surface-2)}
.menu .who{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:13px;color:var(--ink-3)}
.menu .who b{display:block;color:var(--ink);font-size:14px}
main{max-width:1320px;margin:0 auto;padding:22px 20px 100px}

/* ---------- common ---------- */
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;color:#fff}
.avs{display:flex;flex-direction:row-reverse;justify-content:flex-end}
.avs .avatar{width:24px;height:24px;font-size:11px;border:2px solid var(--surface);margin-inline-start:-7px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.when{font-size:12.5px;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.when.late{color:var(--red);font-weight:600}
.when.today{color:var(--amber);font-weight:600}
.typeic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;gap:8px}
.panel-h h3{margin:0;font-size:15px;font-weight:600}
.panel-b{padding:6px 16px 16px}
.muted{color:var(--ink-3)}
.empty{color:var(--ink-3);text-align:center;padding:26px 12px;font-size:14px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;padding:5px 14px;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:14px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.select,.search{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px;color:var(--ink)}
.search{min-width:180px;flex:1;max-width:320px}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-h h1{margin:0;font-size:22px;font-weight:700}
.sdot{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.sdot i{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ---------- home ---------- */
.hello h1{margin:0;font-size:24px;font-weight:700}
.hello p{margin:2px 0 0;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:start;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.stat:hover{border-color:var(--ink-3);transform:translateY(-2px)}
.stat::after{content:'';position:absolute;inset-inline-end:-18px;bottom:-18px;width:70px;height:70px;border-radius:50%;background:var(--sc,var(--accent));opacity:.08}
.stat.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stat .n{font-size:28px;font-weight:700;line-height:1.2}
.stat .l{font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.stat .l .dot{width:8px;height:8px;border-radius:50%}
.stat.red .n{color:var(--red)} .stat.amber .n{color:var(--amber)} .stat.blue .n{color:var(--accent)}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px}
.grp{padding:4px 0}
.grp h4{margin:10px 16px 4px;font-size:12.5px;color:var(--ink-3);font-weight:600;display:flex;gap:6px;align-items:center}
.grp h4 .c{background:var(--surface-2);border-radius:999px;padding:0 7px;font-size:11.5px}
.row{display:flex;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--line);cursor:pointer;position:relative;animation:rise .28s ease both;animation-delay:calc(var(--i,0) * 22ms)}
.row::before{content:'';position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--sc,transparent)}
.row:hover{background:var(--surface-2)}
.row .nm2{color:var(--ink-2);font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
.grp .row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.row .sub{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.row .right{display:flex;align-items:center;gap:10px;flex:none}
.next{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.next:hover{border-color:var(--accent);color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--surface-2);border-radius:10px;padding:8px 2px;text-align:center;border:1px solid transparent}
.wd:hover{border-color:var(--line)}
.wd.today{background:var(--accent-soft);border-color:var(--accent)}
.wd .dn{font-size:11px;color:var(--ink-3)}
.wd .dd{font-size:16px;font-weight:700}
.wd .dots{display:flex;gap:2px;justify-content:center;min-height:6px;margin-top:3px;flex-wrap:wrap;padding:0 3px}
.wd .dots i{width:5px;height:5px;border-radius:50%}
.load-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.load-row .nm{width:72px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{flex:1;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.load-row .v{font-size:13px;color:var(--ink-2);min-width:42px;text-align:end}
.load-row .v b{color:var(--red)}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%}
.hero{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--accent-soft),color-mix(in srgb,var(--surface) 70%,var(--accent-soft)));border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin:14px 0 4px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--surface-3) 0)}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:14px}
.hero .txt{flex:1;min-width:0}
.hero .txt b{font-size:15.5px}
.hero .txt div{color:var(--ink-2);font-size:13.5px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.4s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}

/* ---------- KPI ---------- */
.kpi{margin:14px 0 4px}
.kpi-b{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.kb-h{display:flex;align-items:baseline;gap:8px;font-size:13.5px;margin-bottom:6px}
.kb-h b{font-size:18px}
.kb-h .muted{font-size:12px;margin-inline-start:auto}
.kb-bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.kb-bar i{display:block;height:100%;border-radius:999px;transition:width .6s}
.kp-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.kp-row:first-child{border-top:0}
.kp-row .nm{width:84px;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp-cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kp-m{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.kp-m .kb-bar{flex:1;height:8px}
.kp-m b{min-width:38px;text-align:end;font-size:13px}

/* ---------- calendar ---------- */
.cal-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-bar .m{font-size:17px;font-weight:700;margin-inline:6px;white-space:nowrap}
.cal-bar .sp{flex:1}
.cal-bar .search{min-width:160px;max-width:220px;flex:none}
.navb{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:none;border:1px solid var(--line);color:var(--ink-2);font-size:16px}
.navb:hover{background:var(--surface-2)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;font-size:12.5px;color:var(--ink-2)}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend i{width:9px;height:9px;border-radius:3px}
.calwrap{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.calmain{flex:1;min-width:0}
.cal{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));background:var(--line);gap:1px}
.cal .dow{background:var(--surface-2);text-align:center;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:8px 0}
.cal .wkn{background:var(--surface);color:var(--ink-3);font-size:11px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px}
.day{background:var(--surface);min-height:150px;padding:6px 6px 34px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0;transition:background .1s,box-shadow .1s}
.day.out{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.day.out .dnum{color:var(--ink-3)}
.day .dnum{position:absolute;bottom:6px;inset-inline-end:8px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:24px;height:24px;display:grid;place-items:center;border-radius:6px;padding:0 5px}
.day.today .dnum{background:var(--accent);color:var(--accent-ink)}
.day .add{position:absolute;bottom:6px;inset-inline-end:38px;width:24px;height:24px;border-radius:6px;border:0;background:var(--surface-3);color:var(--ink);font-size:17px;line-height:1;display:grid;place-items:center;opacity:0;transition:opacity .12s}
.day:hover .add,.day .add:focus-visible{opacity:1}
.day.drop,.col.drop,.cpanel.drop{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.cal.wk .day{min-height:62vh}
.ce{border-radius:8px;padding:6px 8px;background:color-mix(in srgb,var(--sc) 24%,var(--surface));border-inline-start:3px solid var(--sc);cursor:grab;display:flex;flex-direction:column;gap:2px;min-width:0;font-size:12px;transition:transform .12s,box-shadow .12s;touch-action:none;user-select:none;-webkit-user-select:none}
.ce:hover{box-shadow:0 4px 14px rgba(0,0,0,.16);transform:translateY(-1px)}
.ce .cl{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ce .ct2{font-size:13px;font-weight:600;color:var(--ink);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;unicode-bidi:plaintext}
.ce .cm{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);min-height:24px}
.ce .cm .avs{margin-inline-start:auto}
.ce .cm .avatar{width:22px;height:22px;font-size:10px;border-color:color-mix(in srgb,var(--sc) 24%,var(--surface))}
.ce .tm2{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.ce .flag{width:13px;height:13px;flex:none}
.ce.done{opacity:.72}
.ce.late{box-shadow:inset 0 0 0 1px var(--red)}
.ce.sel,.card.sel{box-shadow:0 0 0 2px var(--accent)!important}
.ce.dragging,.card.dragging{opacity:.3}
.ce.moved,.card.moved{animation:pop .55s ease}
@keyframes pop{0%{transform:scale(.9);box-shadow:0 0 0 3px var(--accent)}60%{transform:scale(1.03)}100%{transform:none}}
.drag-ghost{position:fixed;top:0;left:0;z-index:90;pointer-events:none;will-change:transform}
.drag-ghost .ce,.drag-ghost .card{transform:rotate(-2deg);box-shadow:0 16px 36px rgba(0,0,0,.35);opacity:.96}
.drag-ghost .stk{position:absolute;inset:6px -6px -6px 6px;border-radius:8px;background:var(--surface-3);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.drag-ghost .cnt{position:absolute;top:-9px;inset-inline-end:-9px;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 7px;z-index:2}
body.dragging-ui,body.dragging-ui *{cursor:grabbing!important;user-select:none}
.selbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:12px;z-index:50;box-shadow:var(--shadow-lg);font-size:14px;white-space:nowrap}
.selbar button{background:none;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);color:inherit;border-radius:8px;padding:4px 10px}
.cside{display:flex;border-inline-start:1px solid var(--line);background:var(--surface)}
.cstrip{display:flex;flex-direction:column;gap:6px;padding:10px 4px;width:42px;align-items:center;position:sticky;top:72px;align-self:flex-start}
.cstrip button{writing-mode:vertical-rl;background:none;border:0;padding:12px 5px;border-radius:8px;color:var(--ink-2);font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.cstrip button b{font-weight:700;color:var(--ink)}
.cstrip button.red b{color:var(--red)}
.cstrip button.on{background:var(--accent-soft);color:var(--accent-2)}
.cstrip button:hover{background:var(--surface-2)}
.cpanel{width:290px;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;max-height:82vh;position:sticky;top:64px;align-self:flex-start}
.cpanel h4{margin:0;padding:10px 12px 10px 14px;font-size:14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.cpanel h4 .icon-btn{margin-inline-start:auto}
.cpanel .hint{font-size:12px;color:var(--ink-3);padding:8px 14px 0}
.cpanel .lst{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.agenda{display:none}
.ag-day{margin-bottom:14px}
.ag-day h4{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.ag-day.today h4{color:var(--accent)}

/* ---------- board ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;min-height:140px;border:1px solid transparent;transition:background .1s,box-shadow .1s}

details.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:12px}

window.TASHEEH_API = "https://script.google.com/macros/s/AKfycbz7h3kZAdv84q8A9rrj3D8zELWmZVdo4INFbNSi_E-cxk4oLQXI5UlovSLcQFYIs1A/exec";
(function(){
 const q = new URLSearchParams(location.search);
 const boot = {authToken:'', initialTask:(q.get('task')||'').replace(/[^\w-]/g,'').slice(0,120), initialView:(q.get('view')||'').replace(/[^a-z]/g,'').slice(0,20), bridgeUrl:''};
 document.addEventListener('DOMContentLoaded', () => {}, {once:true});
 window.__TASHEEH_BOOT = JSON.stringify(boot);
 window.google = {script:{
  history:{replace(state, params){ try{ const u=new URL(location.href); u.search=new URLSearchParams(params||{}).toString(); history.replaceState(null,'',u); }catch(e){} }},
  get run(){ const b={ok:null,fail:null,
   withSuccessHandler(f){b.ok=f;return b;}, withFailureHandler(f){b.fail=f;return b;},
   rpc(req){ fetch(window.TASHEEH_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({ui:true},req)),credentials:'omit',redirect:'follow'})
     .then(r=>r.json()).then(d=>b.ok&&b.ok(d)).catch(e=>b.fail&&b.fail(new Error('تعذّر الاتصال بالسيرفر. تأكد من الإنترنت وحاول مرة ثانية')));}};
   return b; }
 }};
})();

/* ================= time (Baghdad) ================= */
function nowStr(){
const p = {}; new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
.formatToParts(new Date()).forEach(x => p[x.type] = x.value);
return p.year + '-' + p.month + '-' + p.day + ' ' + p.hour + ':' + p.minute;
}
const today = () => nowStr().slice(0,10);
const isDate = s => /^\d{4}-\d{2}-\d{2}/.test(s || '');
const dOf = t => isDate(t.publish_at) ? t.publish_at.slice(0,10) : '';
function addDays(ymd, n){ const d = new Date(ymd + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
const dow = ymd => new Date(ymd + 'T00:00:00Z').getUTCDay();
function fmtTime(hm){ if (!hm) return ''; let [h,m] = hm.split(':').map(Number); const pm = h >= 12; h = h % 12 || 12; return h + (m ? ':' + String(m).padStart(2,'0') : '') + (pm ? ' م' : ' ص'); }
function fmtDay(ymd){
const td = today();
if (ymd === td) return 'اليوم';
if (ymd === addDays(td,1)) return 'غداً';
if (ymd === addDays(td,-1)) return 'أمس';
return DAYS[dow(ymd)] + ' ' + Number(ymd.slice(8)) + '/' + Number(ymd.slice(5,7));
}
function fmtWhen(s){ if (!isDate(s)) return 'بدون موعد'; const t = s.slice(11,16); return fmtDay(s.slice(0,10)) + (t ? ' · ' + fmtTime(t) : ''); }
function longDate(ymd){ return DAYS[dow(ymd)] + ' ' + Number(ymd.slice(8)) + ' ' + MONTHS[Number(ymd.slice(5,7)) - 1]; }
function due(t){
if (DONE.includes(t.status)) return '';
const dl = deadline(t); if (!dl) return '';
if (dl < Date.now()) return 'late';
return dOf(t) === today() ? 'today' : '';
}
// The chosen Baghdad deadline is authoritative; workflow stages never subtract lead time.
function deadline(t){ const d = dOf(t); if (!d) return 0; const tm = (t.publish_at || '').slice(11,16) || '23:59'; const p = Date.parse(d + 'T' + tm + ':00+03:00'); return Number.isFinite(p) ? p : 0; }
const dlKind = t => t.calendar_kind==='operations'?'تنفيذ المهمة':t.deadline_kind==='publish'?'النشر':'التسليم';
function fmtDur(ms){
const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
const p = n => String(n).padStart(2,'0');
if (d >= 1) return d + ' ' + (d === 1 ? 'يوم' : d === 2 ? 'يومان' : d <= 10 ? 'أيام' : 'يوماً') + (hh ? ' و' + hh + ' س' : '');
return p(hh) + ':' + p(m) + ':' + p(x);
}
function hrsTxt(ms){
const h = Math.round(Math.abs(ms) / 3600e3);
if (h < 1) return 'أقل من ساعة';
if (h >= 48){ const d = Math.round(h / 24); return d === 2 ? 'يومين' : d <= 10 ? d + ' أيام' : d + ' يوماً'; }
return h === 1 ? 'ساعة' : h === 2 ? 'ساعتين' : h <= 10 ? h + ' ساعات' : h + ' ساعة';
}
function tick(){
const now = Date.now();
document.querySelectorAll('[data-dl]').forEach(el => {
const diff = +el.dataset.dl - now, over = diff < 0, txt = fmtDur(Math.abs(diff));
const cd = el.querySelector('.cd');
if (cd){ cd.textContent = txt; cd.style.fontFamily = Math.abs(diff) >= 864e5 ? 'inherit' : ''; const l = el.querySelector('.cl'); if (l) l.textContent = over ? 'متأخرة عن ' + (el.dataset.k || 'الموعد') : 'متبقٍّ على ' + (el.dataset.k || 'الموعد'); }
else el.textContent = (over ? 'متأخرة ' : 'متبقٍّ ') + txt;
el.classList.toggle('over', over); el.classList.toggle('soon', !over && diff < 3 * 3600e3);
});
}

function kpiPanel(td){
const ws0 = addDays(td, -dow(td)), we0 = addDays(ws0, 6), ns0 = addDays(ws0, 7), ne0 = addDays(ws0, 13);
const isDoneFor = (t, k) => k === REV() ? ['ready','scheduled','published'].includes(t.status) : DELIVERED.includes(t.status);
const rdy = (k, a, b) => { const l = st.tasks.filter(t=>!st.f.campaign||t.campaign===st.f.campaign).filter(t => t.status !== 'archived' && dOf(t) >= a && dOf(t) <= b && who(t).includes(k)); const d = l.filter(t => isDoneFor(t, k)).length; return {total:l.length, done:d, pct: l.length ? Math.round(d / l.length * 100) : 100}; };
const col = p => p >= 100 ? 'var(--green)' : p >= 60 ? 'var(--amber)' : 'var(--red)';
const kbar = (label, r) => '<div class="kb"><div class="kb-h"><span>' + label + '</span><b style="color:' + col(r.pct) + '">' + r.pct + '%</b><span class="muted">' + r.done + ' من ' + r.total + '</span></div><div class="kb-bar"><i style="width:' + r.pct + '%;background:' + col(r.pct) + '"></i></div></div>';
const mini = (label, r) => '<div class="kp-m"><span>' + label + '</span><div class="kb-bar"><i style="width:' + r.pct + '%;background:' + col(r.pct) + '"></i></div><b style="color:' + col(r.pct) + '">' + r.pct + '%</b></div>';
const head = '<div class="panel-h"><h3>مستوى الإنجاز</h3><span class="muted" style="font-size:12px">الهدف: مهام كل أسبوع جاهزة 100% قبل بدايته</span></div>';
if (st.scope === 'team'){
const rows = st.team.filter(m => m.active === 'yes').map(m => ({m, a: rdy(m.key, ws0, we0), b: rdy(m.key, ns0, ne0)})).filter(r => r.a.total || r.b.total);
return '<div class="panel kpi">' + head + '<div class="panel-b">' + (rows.map(r => '<div class="kp-row">' + av(r.m.key) + '<span class="nm">' + esc(r.m.name) + '</span><div class="kp-cols">' + mini('هذا الأسبوع', r.a) + mini('القادم', r.b) + '</div></div>').join('') || '<div class="empty">لا توجد مهام لهذا الأسبوع أو القادم.</div>') + '</div></div>';
}
return '<div class="panel kpi">' + head + '<div class="panel-b kpi-b">' + kbar('إنجاز هذا الأسبوع', rdy(st.user, ws0, we0)) + kbar('جاهزية الأسبوع القادم', rdy(st.user, ns0, ne0)) + '</div></div>';
}

function isoWeek(ymd){
const d = new Date(ymd + 'T00:00:00Z'); const wd = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - wd + 3);
const fy = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
return 1 + Math.round(((d - fy) / 864e5 - 3 + ((fy.getUTCDay() + 6) % 7)) / 7);
}

if (!st.calWeek) st.calWeek = st.month === td.slice(0,7) ? td : st.month + '-01';
start = addDays(st.calWeek, -dow(st.calWeek)); rows = 1;
const e = addDays(start, 6);

const [y, m] = st.month.split('-').map(Number);
const first = st.month + '-01', lead = dow(first), dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
rows = Math.ceil((lead + dim) / 7); start = addDays(first, -lead);

const byDay = {}; base.filter(t => dOf(t)).forEach(t => (byDay[dOf(t)] = byDay[dOf(t)] || []).push(t));

grid += '<div class="wkn">' + isoWeek(addDays(rs, 1)) + '</div>';

/* ================= drag & drop (pointer based — works inside the Apps Script frame) ================= */
function selbarHTML(){ return st.sel.size ? '<div class="selbar"><b>' + st.sel.size + '</b> محددة · اسحب أيّاً منها لنقلها معاً<button id="selClear">إلغاء التحديد</button></div>' : ''; }
function bindSelbar(){ const sc = $('#selClear'); if (sc) sc.onclick = () => { st.sel.clear(); render(); }; }
function toggleSel(id){ st.sel.has(id) ? st.sel.delete(id) : st.sel.add(id); render(); }
(function dnd(){
let s = null;
const SEL = '.ce[data-id], .card[data-id]';
const cleanup = () => {
if (s.ghost) s.ghost.remove();
if (s.target) s.target.classList.remove('drop');
$$('.dragging').forEach(x => x.classList.remove('dragging'));
document.body.classList.remove('dragging-ui');
st.dragging = false;
};
const start = () => {
s.started = true; st.dragging = true;
s.ids = st.sel.has(s.id) ? Array.from(st.sel) : [s.id];
const r = s.el.getBoundingClientRect();
s.ox = s.x - r.left; s.oy = s.y - r.top;
const gh = document.createElement('div'); gh.className = 'drag-ghost'; gh.style.width = r.width + 'px';
gh.innerHTML = (s.ids.length > 1 ? '<div class="stk"></div>' : '') + s.el.outerHTML + (s.ids.length > 1 ? '<span class="cnt">' + s.ids.length + '</span>' : '');
document.body.appendChild(gh); s.ghost = gh;
s.ids.forEach(id => $$('[data-id="' + CSS.escape(id) + '"]').forEach(x => { if (x.matches(SEL)) x.classList.add('dragging'); }));
document.body.classList.add('dragging-ui');
};
const move = e => {
s.ghost.style.transform = 'translate(' + (e.clientX - s.ox) + 'px,' + (e.clientY - s.oy) + 'px)';
const under = document.elementFromPoint(e.clientX, e.clientY);
const tgt = under ? (under.closest('.day[data-day]') || under.closest('.cpanel[data-panel="unscheduled"]') || under.closest('.col[data-col]')) : null;
if (tgt !== s.target){ if (s.target) s.target.classList.remove('drop'); s.target = tgt; if (tgt) tgt.classList.add('drop'); }
const edge = 70, vh = window.innerHeight;
if (e.clientY < edge) window.scrollBy(0, -14); else if (e.clientY > vh - edge) window.scrollBy(0, 14);
const bd = $('.board'); if (bd && st.view === 'board'){ const br = bd.getBoundingClientRect(); if (e.clientX < br.left + 50) bd.scrollLeft -= 14; else if (e.clientX > br.right - 50) bd.scrollLeft += 14; }
};
document.addEventListener('pointerdown', e => {
if(matchMedia('(max-width:900px)').matches)return;
if (e.button !== 0 || e.shiftKey || e.metaKey || e.ctrlKey || !['calendar','operations','board'].includes(st.view)) return;
const el = e.target.closest(SEL); if (!el) return;
s = {id: el.dataset.id, x: e.clientX, y: e.clientY, el, started: false, target: null};
});
document.addEventListener('pointermove', e => {
if (!s) return;
if (!s.started){ if (Math.hypot(e.clientX - s.x, e.clientY - s.y) < 6) return; start(); }
e.preventDefault(); move(e);
});
document.addEventListener('pointerup', () => {
if (!s) return;
if (s.started){
const tgt = s.target, ids = s.ids;
cleanup();
st.suppressClick = true; setTimeout(() => { st.suppressClick = false; }, 80);
if (tgt){
if (tgt.dataset.col) setStatusMany(ids, tgt.dataset.col);
else moveMany(ids, tgt.dataset.day || '');
}
}
s = null;
});
document.addEventListener('pointercancel', () => { if (s && s.started) cleanup(); s = null; });
document.addEventListener('click', e => {
if (st.suppressClick){ e.stopPropagation(); e.preventDefault(); return; }
if (!['calendar','operations','board'].includes(st.view)) return;
const el = e.target.closest(SEL); if (!el) return;
if (e.shiftKey || e.metaKey || e.ctrlKey){ e.stopPropagation(); e.preventDefault(); toggleSel(el.dataset.id); }
}, true);
})();

async function moveMany(ids, d){
const olds = {}, moved = [];
ids.forEach(id => {
const t = st.tasks.find(x => x.id === id); if (!t) return;
const nv = d ? d + ' ' + ((t.publish_at || '').slice(11,16) || '20:00') : '';
if (nv === (t.publish_at || '')) return;
olds[id] = t.publish_at || ''; t.publish_at = nv; moved.push(id);
});
if (!moved.length) return;
st.sel.clear();
st.justMoved = new Set(moved); render();
setTimeout(() => { st.justMoved = null; }, 900);
toast(d ? (moved.length > 1 ? 'نُقلت ' + moved.length + ' مهام إلى ' + fmtDay(d) : 'نُقلت إلى ' + fmtWhen(st.tasks.find(x => x.id === moved[0]).publish_at)) : 'أُزيل الموعد');
try {
const r = await rpc('moveTasks', {ids: moved, date: d});
(r.tasks || []).forEach(nt => { const t = st.tasks.find(x => x.id === nt.id); if (t) Object.assign(t, nt); delete st.cache[nt.id]; });
} catch(e){
moved.forEach(id => { const t = st.tasks.find(x => x.id === id); if (t) t.publish_at = olds[id]; });
render(); toast('تعذّر النقل: ' + e.message);
}
}

/* ================= status change (optimistic) ================= */
async function setStatus(id, status){ return setStatusMany([id], status); }
async function setStatusMany(ids, status){
const changed = [];
ids.forEach(id => { const t = st.tasks.find(x => x.id === id); if (t && t.status !== status){ changed.push([t, t.status]); t.status = status; } });
if (!changed.length) return;
st.sel.clear(); st.justMoved = new Set(changed.map(c => c[0].id)); render();
setTimeout(() => { st.justMoved = null; }, 900);
toast(status === 'published' ? 'نُشرت المهمة. أحسنت!' : 'أصبحت: ' + S[status].label + (changed.length > 1 ? ' (' + changed.length + ' مهام)' : ''));
if (status === 'published') confetti();
for (const [t, old] of changed){
try { const d = await rpc('updateTask', {id:t.id, fields:{status}}); const light = Object.assign({}, d.task); delete light.brief; Object.assign(t, light); delete st.cache[t.id]; }
catch(e){ t.status = old; render(); toast(e.message); }
}
}

function followData(){
const now = Date.now();
const open = st.tasks.filter(t => !DONE.includes(t.status) && deadline(t));
return st.team.filter(m => m.active === 'yes' && m.key !== REV()).map(m => {
const mt = open.filter(t => ownersOf(t).includes(m.key)).sort((a,b) => deadline(a) - deadline(b));
return {m, mine: mt, late: mt.filter(t => deadline(t) < now), soon: mt.filter(t => deadline(t) >= now && deadline(t) - now < 24 * 3600e3)};
}).filter(r => r.mine.length);
}
function itemLine(t){ const diff = deadline(t) - Date.now(), k = dlKind(t); return '• ' + t.title + ' — ' + (diff < 0 ? 'متأخرة ' + hrsTxt(diff) + ' عن موعد ' + k : 'متبقٍّ ' + hrsTxt(diff) + ' على موعد ' + k); }
const personText = (m, items) => 'مرحباً ' + m.name + '،\nتذكير بالمهام التالية:\n' + items.map(itemLine).join('\n') + '\nيُرجى تحديث حالتها في النظام.';
function summaryText(rows){
const lines = rows.map(r => '• ' + r.m.name + ': ' + r.mine.length + ' قيد العمل' + (r.late.length ? '، منها ' + r.late.length + ' متأخرة' : '') + '. الأقرب: ' + short(r.mine[0]) + ' (' + fmtWhen(r.mine[0].publish_at) + ')');
return 'ملخص وضع المحتوى — ' + longDate(today()) + '\n\n' + (lines.join('\n') || 'لا توجد مهام قيد العمل.');
}

return '<div class="fl-p"><div class="fl-h">' + av(r.m.key) + '<b>' + esc(r.m.name) + '</b>' +

async function save(id){

if (!data.campaign){toast('اختر المشروع أولاً');$('#e_campaign').focus();return;}
if (!data.title){ toast('اكتب عنوان المهمة'); $('#e_title').focus(); return; }
const btn = $('#drSave'); btn.disabled = true; $('#drMsg').textContent = 'جارٍ الحفظ…';
try {
if (id){
const wasPub = (st.tasks.find(x => x.id === id) || {}).status === 'published';
const d = await rpc('updateTask', {id,version:st.drawerVersion, fields:data});
if (!wasPub && d.task.status === 'published') confetti();
const i = st.tasks.findIndex(x => x.id === id);
st.cache[id] = d.task;
const light = Object.assign({}, d.task); light.has_brief = !!light.brief; delete light.brief;
st.tasks[i] = Object.assign({}, st.tasks[i], light);
toast(mailSaveMessage(d.assignmentMail, 'تم الحفظ ✓'));
} else {
const d = await rpc('createTask', {task:data});
const light = Object.assign({comments_count:0}, d.task); light.has_brief = !!light.brief; delete light.brief;
st.tasks.push(light);
const notify = who(d.task).filter(k => k !== st.user);
toast(mailSaveMessage(d.assignmentMail, 'تمت إضافة المهمة وحفظ المسؤولين عنها'));

} catch(e){ $('#drMsg').textContent = e.message; btn.disabled = false; }
}

$('#meAv').outerHTML = '<span class="avatar" id="meAv" style="background:' + avColor(st.user) + '">' + esc(initial(st.user)) + '</span>';
$('#meName').textContent = nameOf(st.user);
if (!st.open) render();
if(!silent&&!st.todayShown&&!INITIAL_TASK&&!st.open){st.todayShown=true;if(!matchMedia('(max-width:900px)').matches)showToday();}
if (INITIAL_TASK){
const id = INITIAL_TASK, act = INITIAL_ACTION; INITIAL_TASK = ''; INITIAL_ACTION = '';
const t = st.tasks.find(x => x.id === id);
if (t && act === 'publish' && t.status !== 'published'){
if (await ask('هل تريد تعليم «' + short(t) + '» بأنها منشورة؟')) await setStatus(id, 'published');
else openTask(id);
} else if (t) openTask(id);
}
} catch(e){
if(silent){const ss=$('#connectionState');ss.textContent='تعذر التحديث — البيانات المعروضة قديمة';ss.style.color='var(--red)';}
if (painted && e.code!==401){const ss=$('#connectionState');if(ss){ss.textContent='تعذر التحديث — البيانات المعروضة قديمة';ss.style.color='var(--red)';}}
else if (!silent && e.code!==401 && $('#login').classList.contains('hidden')){ $('#view').innerHTML = '<div class="empty">' + esc(e.message) + '<br><br><button class="btn" id="retry">حاول مرة أخرى</button></div>'; $('#retry').onclick = () => load(); }
}
}

function showLogin(msg){
 $('#app').classList.add('hidden');$('#login').classList.remove('hidden');
 $('#loginErr').textContent=msg||'';$('#codeStep').classList.add('hidden');$('#whos').classList.remove('hidden');
 const b=$('#loginBtn');if(BOOT.bridgeUrl){b.href=BOOT.bridgeUrl;b.classList.remove('hidden');}else b.classList.add('hidden');
 $('#loginMsg').textContent='اختر اسمك، ويوصلك رمز دخول على إيميلك.';
 $('#whos').innerHTML='<div class="muted">جارٍ التحميل…</div>';
 rpc('loginOptions').then(d=>{
  $('#whos').innerHTML=d.members.map(m=>'<button data-who="'+esc(m.id)+'"><span class="avatar" style="background:'+avColor(m.id)+'">'+esc(String(m.name).trim().charAt(0))+'</span>'+esc(m.name)+'</button>').join('')||'<div class="muted">ماكو أسماء مفعّلة. تواصل مع جعفر.</div>';
  $$('#whos [data-who]').forEach(x=>x.onclick=()=>sendCode(x.dataset.who,x.textContent));
 }).catch(e=>{$('#whos').innerHTML='';$('#loginErr').textContent=e.message;});
}
let loginWho='',loginName='';
async function sendCode(id,name){
 loginWho=id;if(name)loginName=name;$('#loginErr').textContent='';$$('#whos button,#codeResend').forEach(x=>x.disabled=true);
 try{const d=await rpc('requestLoginCode',{id});
  $('#whos').classList.add('hidden');$('#codeStep').classList.remove('hidden');
  $('#loginMsg').textContent='أهلاً '+loginName+'. أرسلنا رمز من 6 أرقام إلى '+d.sentTo+' (شوف البريد غير المرغوب أيضاً).';
  $('#loginCode').value='';setTimeout(()=>$('#loginCode').focus(),50);
 }catch(e){$('#loginErr').textContent=e.message;}finally{$$('#whos button,#codeResend').forEach(x=>x.disabled=false);}
}
async function verifyCode(){
 const code=$('#loginCode').value.replace(/\D/g,'');if(code.length!==6){$('#loginErr').textContent='اكتب الرمز من 6 أرقام';return;}
 if($('#codeBtn').disabled)return;$('#codeBtn').disabled=true;$('#loginErr').textContent='';
 try{const d=await rpc('verifyLoginCode',{id:loginWho,code});st.token=d.token;lsSet('tasheeh_auth',d.token);
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');load();}
 catch(e){$('#loginErr').textContent=e.message;}finally{$('#codeBtn').disabled=false;}
}
function logout(){lsSet('tasheeh_auth',null);lsSet('tasheeh_boot',null);st.token='';showLogin('تم تسجيل الخروج من هذا المتصفح.');}
function start(){
 if(BOOT.authToken){st.token=BOOT.authToken;lsSet('tasheeh_auth',BOOT.authToken);try{google.script.history.replace(null,{});}catch(e){}}
 else st.token=lsGet('tasheeh_auth')||'';
 $('#login').classList.add('hidden');$('#app').classList.remove('hidden');load();
}
$('#codeBtn').onclick=verifyCode;$('#loginCode').addEventListener('keydown',e=>{if(e.key==='Enter')verifyCode();});$('#loginCode').addEventListener('input',()=>{if($('#loginCode').value.replace(/\D/g,'').length===6)verifyCode();});
$('#codeBack').onclick=()=>showLogin('');$('#codeResend').onclick=()=>sendCode(loginWho,'');

/* ================= wiring ================= */
$('#newBtn').onclick = () => openTask(null);
$('#drClose').onclick = $('#drCancel').onclick = $('#scrim').onclick = () => closeDrawer();
$('#meBtn').onclick = e => { e.stopPropagation(); $('#menu').classList.toggle('hidden'); };
document.addEventListener('click', e => { if (!e.target.closest('.me-wrap')) $('#menu').classList.add('hidden'); });
$('#refreshBtn').onclick = () => { $('#menu').classList.add('hidden'); load(true); };
$('#archiveTasksBtn').onclick=async()=>{
 $('#menu').classList.add('hidden');if(!st.admin)return;
 const tasks=st.tasks.filter(t=>t.status!=='archived').map(t=>({id:t.id,version:t.version}));
 if(!tasks.length){toast('ماكو مهام حالية للإلغاء');return;}
 if(!await ask('إلغاء '+tasks.length+' مهمة حالية من كل المشاريع ونقلها للأرشيف؟ تقدر تسترجعها من الإعدادات.'))return;
 try{const d=await rpc('archiveCurrentTasks',{tasks});st.tasks=[];st.archive=null;st.cache={};st.sel.clear();render();toast('تم إلغاء وأرشفة '+d.archived+' مهمة');}catch(e){toast(e.message);}
};
$('#mobileBoardBtn').onclick=()=>{$('#menu').classList.add('hidden');go('board');};
$('#mineBtn').onclick=()=>{$('#menu').classList.add('hidden');go('mine');};
$('#historyBtn').onclick=()=>{$('#menu').classList.add('hidden');go('history');};
$('#adminBtn').onclick=()=>{$('#menu').classList.add('hidden');go('admin');};
$('#followMenuBtn').onclick=()=>{$('#menu').classList.add('hidden');showFollow();};
$('#todayBtn').onclick = () => { $('#menu').classList.add('hidden'); showToday(); };
$('#logoutBtn').onclick = logout;
$('#themeBtn').onclick = () => {
const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const next = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; lsSet('tasheeh_theme', next);
};
document.addEventListener('keydown', e => {
if (e.key === 'Escape'){
const m = document.querySelector('#projectColorModal, #todayModal, #followModal'); if (m){ m.remove(); return; }
if (st.sel.size){ st.sel.clear(); render(); return; }
if (st.open && $('#modal').classList.contains('hidden')) closeDrawer();
}
if ((e.ctrlKey || e.metaKey) && e.key === 's' && st.open){ e.preventDefault(); if (!$('#drSave').disabled) $('#drSave').click(); }
});
{ const th = lsGet('tasheeh_theme'); if (th) document.documentElement.dataset.theme = th; }
let viewportTimer,lastLayoutWidth=window.innerWidth;
function mobileViewport(){
 const vv=window.visualViewport,h=vv?vv.height:window.innerHeight;
 document.documentElement.style.setProperty('--visible-height',h+'px');
 document.documentElement.classList.toggle('keyboard-open',window.innerHeight-h>120);
}
mobileViewport();if(window.visualViewport)window.visualViewport.addEventListener('resize',mobileViewport);
window.addEventListener('resize',()=>{mobileViewport();if(window.innerWidth===lastLayoutWidth)return;lastLayoutWidth=window.innerWidth;clearTimeout(viewportTimer);viewportTimer=setTimeout(()=>{if(st.tasks&&st.user&&!st.open&&!st.sel.size)render();},120);});
setInterval(tick, 1000);
setInterval(() => { if (st.pass && st.user && st.view!=='admin' && !st.open && !st.dragging && !st.sel.size && document.visibilityState === 'visible' && $('#modal').classList.contains('hidden')) load(true); }, 60000);

start();
})();
</script>
</body>
</html>
